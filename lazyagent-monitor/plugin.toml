id         = "inner/lazyagent-monitor"
name       = "Lazyagent Monitor"
version    = "1.6.0"
plugin_api = 31
license    = "MIT"
description = "Shows active LLM agents from the local lazyagent API in the bar"
tags       = ["llm", "agents", "monitor"]
dependencies = ["lazyagent"]

[[setting]]
key             = "token"
type            = "string"
label_key       = "settings.token.label"
description_key = "settings.token.description"
default         = ""

[[setting]]
key             = "lazyagent_bin"
type            = "string"
label_key       = "settings.lazyagent_bin.label"
description_key = "settings.lazyagent_bin.description"
default         = "lazyagent"
advanced        = true

[[widget]]
id    = "monitor"
entry = "widget.luau"

  [[widget.setting]]
  key             = "language"
  type            = "select"
  label_key       = "settings.language.label"
  description_key = "settings.language.description"
  default         = "auto"
  options = [
    { value = "auto", label_key = "settings.language.options.auto" },
    { value = "en",   label_key = "settings.language.options.en" },
    { value = "ru",   label_key = "settings.language.options.ru" },
    { value = "de",   label_key = "settings.language.options.de" },
    { value = "fr",   label_key = "settings.language.options.fr" },
    { value = "es",   label_key = "settings.language.options.es" },
    { value = "it",   label_key = "settings.language.options.it" },
    { value = "pt",   label_key = "settings.language.options.pt" },
    { value = "zh",   label_key = "settings.language.options.zh" },
    { value = "ja",   label_key = "settings.language.options.ja" },
    { value = "hi",   label_key = "settings.language.options.hi" },
  ]

  [[widget.setting]]
  key             = "icon_glyph"
  type            = "glyph"
  label_key       = "settings.icon_glyph.label"
  description_key = "settings.icon_glyph.description"
  default         = "robot"

  [[widget.setting]]
  key             = "icon_image"
  type            = "file"
  label_key       = "settings.icon_image.label"
  description_key = "settings.icon_image.description"
  default         = ""
  extensions      = [".svg"]

  [[widget.setting]]
  key             = "icon_colorize"
  type            = "bool"
  label_key       = "settings.icon_colorize.label"
  description_key = "settings.icon_colorize.description"
  default         = true

[[desktop_widget]]
id    = "desktop"
entry = "desktop_widget.luau"

  [[desktop_widget.setting]]
  key             = "language"
  type            = "select"
  label_key       = "settings.language.label"
  description_key = "settings.language.description"
  default         = "auto"
  options = [
    { value = "auto", label_key = "settings.language.options.auto" },
    { value = "en",   label_key = "settings.language.options.en" },
    { value = "ru",   label_key = "settings.language.options.ru" },
    { value = "de",   label_key = "settings.language.options.de" },
    { value = "fr",   label_key = "settings.language.options.fr" },
    { value = "es",   label_key = "settings.language.options.es" },
    { value = "it",   label_key = "settings.language.options.it" },
    { value = "pt",   label_key = "settings.language.options.pt" },
    { value = "zh",   label_key = "settings.language.options.zh" },
    { value = "ja",   label_key = "settings.language.options.ja" },
    { value = "hi",   label_key = "settings.language.options.hi" },
  ]

  [[desktop_widget.setting]]
  key             = "icon_glyph"
  type            = "glyph"
  label_key       = "settings.icon_glyph.label"
  description_key = "settings.icon_glyph.description"
  default         = "robot"

  [[desktop_widget.setting]]
  key             = "icon_image"
  type            = "file"
  label_key       = "settings.icon_image.label"
  description_key = "settings.icon_image.description"
  default         = ""
  extensions      = [".svg"]

  [[desktop_widget.setting]]
  key             = "icon_colorize"
  type            = "bool"
  label_key       = "settings.icon_colorize.label"
  description_key = "settings.icon_colorize.description"
  default         = true

  [[desktop_widget.setting]]
  key             = "compact"
  type            = "bool"
  label_key       = "settings.compact.label"
  description_key = "settings.compact.description"
  default         = false

  [[desktop_widget.setting]]
  key             = "icon_scale"
  type            = "int"
  label_key       = "settings.icon_scale.label"
  description_key = "settings.icon_scale.description"
  default         = 100
  min             = 50
  max             = 200
  step            = 5

[[service]]
id    = "bridge"
entry = "service.luau"
